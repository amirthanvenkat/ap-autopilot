[project]
name = "ap-autopilot"
version = "0.1.0"
description = "Accounts payable automation pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "google-auth>=2.36",
    "jsonschema>=4.23",
    "python-ulid>=3.0",
    "structlog>=24.4",
    # Required by FastAPI to parse multipart/form-data, which is how
    # POST /v1/documents receives a file.
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = []
warn_unreachable = true
disallow_any_generics = true
# google-auth ships no type information for these entry points, and a
# stub package would be more surface than the two calls justify.
untyped_calls_exclude = ["google"]

[[tool.mypy.overrides]]
module = ["google.auth.*", "google.oauth2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error"]
